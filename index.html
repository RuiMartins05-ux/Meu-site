<section id="weekly" class="section">

  <div class="card fut-weekly">

    <div class="weekly-header">
      <div>
        <h2>Planeamento Semanal</h2>
        <p class="weekly-subtitle">
          Organização profissional do microciclo de treino
        </p>
      </div>

      <div class="weekly-actions">
        <button onclick="fcPreviousWeek()">◀</button>
        <button onclick="fcToday()">Hoje</button>
        <button onclick="fcNextWeek()">▶</button>
      </div>
    </div>

    <div class="weekly-settings">

      <div class="field">
        <label>Semana</label>
        <input type="date" id="fc-week-date">
      </div>

      <div class="field">
        <label>Microciclo</label>
        <input type="text" id="fc-microcycle"
               placeholder="Ex.: Microciclo 4">
      </div>

      <div class="field">
        <label>Mesociclo</label>
        <input type="text" id="fc-mesocycle"
               placeholder="Ex.: Preparação">
      </div>

      <div class="field">
        <label>Fase da época</label>
        <input type="text" id="fc-season-phase"
               placeholder="Ex.: Competição">
      </div>

    </div>

    <div class="weekly-toolbar">
      <button class="btn-primary" onclick="fcNewPlan()">
        + Novo Planeamento
      </button>

      <button onclick="fcSavePlan()">
        💾 Guardar
      </button>

      <button onclick="fcExportPlan()">
        🖨️ Exportar
      </button>
    </div>

    <div class="weekly-objectives">

      <h3>Objetivos gerais da semana</h3>

      <textarea id="fc-week-objectives"
        placeholder="Objetivos gerais do microciclo..."></textarea>

      <div class="objective-grid">

        <input id="fc-physical-objective"
          placeholder="Objetivo físico">

        <input id="fc-technical-objective"
          placeholder="Objetivo técnico">

        <input id="fc-tactical-objective"
          placeholder="Objetivo tático">

        <input id="fc-cognitive-objective"
          placeholder="Objetivo cognitivo">

      </div>

    </div>

    <div class="fc-week-grid" id="fc-week-grid"></div>

    <div class="weekly-notes">

      <h3>Observações gerais</h3>

      <textarea id="fc-general-notes"
        placeholder="Observações do treinador..."></textarea>

      <h3>Notas privadas do treinador</h3>

      <textarea id="fc-private-notes"
        placeholder="Estas notas não serão incluídas na exportação..."></textarea>

    </div>

  </div>

</section>
